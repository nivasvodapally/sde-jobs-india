name: Daily Job Update

on:
  schedule:
    # 7:00 AM IST = 1:30 AM UTC
    - cron: '30 1 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml
      
      - name: Fetch SDE jobs
        run: python fetch_jobs.py
      
      - name: Commit and push if updated
        run: |
          git config user.name "SDE Jobs Bot"
          git config user.email "bot@example.com"
          git add jobs.json
          git diff --staged --quiet || (git commit -m "📅 Daily SDE jobs update - $(date +'%d %b %Y')" && git push)
